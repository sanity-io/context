name: Validate

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 15
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm check:lint

      - name: Check formatting
        run: pnpm check:format

      - name: Typecheck
        run: pnpm check:types

  build-eve:
    timeout-minutes: 15
    # eve needs Node 24, so the eve extension builds in its own job.
    name: Build eve extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      # The release job installs with --ignore-scripts, so build the same way.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm --filter @sanity/context-eve build
